<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberLoop — Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #12203a 0%, #0a0f1c 55%, #070b14 100%);
      color: #e6edf7;
      text-align: center;
      padding: 2rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7fb0ff;
      border: 1px solid #24406e;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    h1 .accent { color: #4f8cff; }
    p.sub {
      margin-top: 1rem;
      font-size: 1.05rem;
      color: #9fb0c7;
      max-width: 34rem;
    }
    .pulse {
      margin-top: 2.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: #86efac;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">CVE Risk Intelligence</span>
    <h1>Cyber<span class="accent">Loop</span></h1>
    <p class="sub">LoopScore dashboard is being wired up. This page confirms the hosting pipeline is live — real CVE data lands here next.</p>
    <span class="pulse"><span class="dot"></span> Pipeline online</span>
  </main>
</body>
</html>
