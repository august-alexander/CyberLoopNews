<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberLoop — Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #12203a 0%, #0a0f1c 55%, #070b14 100%);
      color: #e6edf7;
      text-align: center;
      padding: 2rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7fb0ff;
      border: 1px solid #24406e;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    h1 .accent { color: #4f8cff; }
    p.sub {
      margin-top: 1rem;
      font-size: 1.05rem;
      color: #9fb0c7;
      max-width: 34rem;
    }
    .pulse {
      margin-top: 2.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: #86efac;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }

    /* --- top-10 LoopScore bar chart --- */
    .card {
      margin: 2.5rem auto 0;
      width: min(44rem, 100%);
      background: #0f1626;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem 1.5rem 1.25rem;
      text-align: left;
    }
    .card h2 {
      margin: 0 0 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9fb0c7;
    }
    .card .caption { margin: 0 0 1rem; font-size: 0.8rem; color: #6b7c96; }
    .chart { width: 100%; height: auto; display: block; }

    /* recessive chrome */
    .grid line { stroke: #223049; stroke-width: 1; }
    .axis-label { fill: #6b7c96; font-size: 11px; }
    .vendor-label { fill: #9fb0c7; font-size: 12px; }
    /* marks */
    .bar { transition: opacity 0.15s ease; }
    .chart:hover .bar { opacity: 0.45; }
    .chart .bar:hover { opacity: 1; }
    .score-label { fill: #e6edf7; font-size: 11px; font-weight: 600; pointer-events: none; }
    .state { color: #9fb0c7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">CVE Risk Intelligence</span>
    <h1>Cyber<span class="accent">Loop</span></h1>
    <p class="sub">LoopScore dashboard is being wired up. First live widget below — fed from data in S3.</p>

    <section class="card">
      <h2>Top 10 CVEs by LoopScore</h2>
      <p class="caption">Highest-scoring CVEs from the latest ranking run · grouped by vendor</p>
      <svg class="chart" viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Bar chart of the top 10 CVEs by LoopScore, grouped by vendor"></svg>
      <p class="state">Loading…</p>
    </section>

    <span class="pulse"><span class="dot"></span> Pipeline online</span>
  </main>

  <script>
    // Categorical palette (dark-surface steps). Color follows the VENDOR (identity),
    // assigned in first-seen order — never by rank, so a data change never repaints.
    const PALETTE = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#9085e9", "#008300", "#e66767"];
    const SVGNS = "http://www.w3.org/2000/svg";

    // viewBox geometry
    const W = 640, H = 380;
    const plot = { left: 38, right: 632, top: 22, bottom: 320 }; // bottom = baseline
    const Y_MAX = 100;                                            // LoopScore is 0–100
    const barGap = 6, groupGap = 24;                              // within-group vs between-vendor

    const el = (name, attrs, parent) => {
      const n = document.createElementNS(SVGNS, name);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(n);
      return n;
    };
    const yFor = (score) => plot.bottom - (score / Y_MAX) * (plot.bottom - plot.top);

    fetch("/data/top10.json")
      .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then((rows) => {
        const svg = document.querySelector(".chart");

        // Group by vendor; order vendors by their top score, CVEs within by score.
        const groups = {};
        rows.forEach((d) => (groups[d.vendor] ||= []).push(d));
        const vendors = Object.keys(groups).sort(
          (a, b) => Math.max(...groups[b].map((d) => d.score)) - Math.max(...groups[a].map((d) => d.score))
        );
        vendors.forEach((v) => groups[v].sort((a, b) => b.score - a.score));
        const colorOf = Object.fromEntries(vendors.map((v, i) => [v, PALETTE[i % PALETTE.length]]));

        // Bar width so N bars + intra/inter-group gaps fill the plot exactly.
        const N = rows.length, G = vendors.length;
        const gaps = (N - G) * barGap + (G - 1) * groupGap;
        const barW = (plot.right - plot.left - gaps) / N;

        // y gridlines + axis labels at 0/25/50/75/100.
        const grid = el("g", { class: "grid" }, svg);
        for (let s = 0; s <= Y_MAX; s += 25) {
          const y = yFor(s);
          el("line", { x1: plot.left, y1: y, x2: plot.right, y2: y }, grid);
          el("text", { x: plot.left - 8, y: y + 4, "text-anchor": "end", class: "axis-label" }, grid)
            .textContent = s;
        }

        // Bars, grouped by vendor.
        let x = plot.left;
        vendors.forEach((vendor) => {
          const groupStart = x;
          groups[vendor].forEach((d) => {
            const y = yFor(d.score), h = plot.bottom - y;
            const g = el("g", { class: "bar" }, svg);

            el("rect", { x, y, width: barW, height: h, rx: 4, fill: colorOf[vendor] }, g);
            el("title", {}, g).textContent = `${d.cve} — ${vendor} — LoopScore ${d.score}`;

            // score above the bar
            el("text", { x: x + barW / 2, y: y - 6, "text-anchor": "middle", class: "score-label" }, g)
              .textContent = d.score;

            // CVE id shown on hover via the <title> tooltip above — kept off the bar
            // so a low LoopScore (short bar) doesn't clip or overflow the label.

            x += barW + barGap;
          });
          x += groupGap - barGap; // swap the last intra-gap for a group gap

          // vendor label centered under its group
          const groupEnd = x - groupGap;
          el("text", {
            x: (groupStart + groupEnd) / 2, y: plot.bottom + 22,
            "text-anchor": "middle", class: "vendor-label",
          }, svg).textContent = vendor;
        });

        // baseline
        el("line", { x1: plot.left, y1: plot.bottom, x2: plot.right, y2: plot.bottom, stroke: "#38506f" }, svg);

        document.querySelector(".state").remove();
      })
      .catch((err) => {
        document.querySelector(".state").textContent = "Could not load data (" + err.message + ")";
      });
  </script>
</body>
</html>
