# Runs on every PR into dev or main: shows what WOULD change, no apply.
# The environment (workspace + var-file) is the PR's TARGET branch.
name: Terraform Plan

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  plan:
    name: plan (${{ github.base_ref }})
    runs-on: ubuntu-latest
    # NOTE: env lives at JOB level — the secrets context is not available in a
    # workflow-level env block, only job/step level.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_aws_profile: "" # use env creds, not a named profile
      TF_VAR_nist_api_key: ${{ secrets.NIST_API_KEY }}
      TF_VAR_inbox_email: ${{ secrets.INBOX_EMAIL }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      # ENV = the branch this PR merges INTO (dev or main).
      - name: Resolve environment from target branch
        run: echo "ENV=${{ github.base_ref }}" >> "$GITHUB_ENV"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      # Workspace name == branch name. Create it if this is its first run.
      - name: Select workspace
        run: terraform workspace select "$ENV" || terraform workspace new "$ENV"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -var-file="environments/$ENV/terraform.tfvars"
